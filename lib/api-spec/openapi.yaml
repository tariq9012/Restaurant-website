openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Luma Restaurant REST API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/RegisterInput" } }
      responses: { "201": { description: Registered } }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/LoginInput" } }
      responses: { "200": { description: Logged in } }
  /auth/me:
    get:
      operationId: getMe
      responses: { "200": { description: Current user } }
  /categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Categories
          content:
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Category" } } }
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } }
      responses: { "201": { description: Created } }
  /categories/{id}:
    get:
      operationId: getCategory
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Category } }
    put:
      operationId: updateCategory
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } }
      responses: { "200": { description: Updated } }
    delete:
      operationId: deleteCategory
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Deleted } }
  /menu:
    get:
      operationId: listMenu
      parameters:
        - { name: categoryId, in: query, schema: { type: integer } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: available, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, price_asc, price_desc, rating] } }
      responses:
        "200":
          description: Menu items
          content:
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MenuItem" } } }
    post:
      operationId: createMenuItem
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MenuItemInput" } }
      responses: { "201": { description: Created } }
  /menu/{id}:
    get:
      operationId: getMenuItem
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Menu item } }
    put:
      operationId: updateMenuItem
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MenuItemInput" } }
      responses: { "200": { description: Updated } }
    delete:
      operationId: deleteMenuItem
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Deleted } }
  /reservations:
    get:
      operationId: listReservations
      responses: { "200": { description: Reservations } }
    post:
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ReservationInput" } }
      responses: { "201": { description: Created } }
  /reservations/{id}:
    get:
      operationId: getReservation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Reservation } }
    put:
      operationId: updateReservation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ReservationUpdate" } }
      responses: { "200": { description: Updated } }
    delete:
      operationId: deleteReservation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Deleted } }
  /orders:
    get:
      operationId: listOrders
      responses: { "200": { description: Orders } }
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/OrderInput" } }
      responses: { "201": { description: Created } }
  /orders/{id}:
    get:
      operationId: getOrder
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Order } }
    put:
      operationId: updateOrder
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/OrderUpdate" } }
      responses: { "200": { description: Updated } }
    delete:
      operationId: deleteOrder
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Deleted } }
  /reviews:
    get:
      operationId: listReviews
      responses: { "200": { description: Reviews } }
    post:
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ReviewInput" } }
      responses: { "201": { description: Created } }
  /reviews/{id}:
    get:
      operationId: getReview
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Review } }
    put:
      operationId: updateReview
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ReviewInput" } }
      responses: { "200": { description: Updated } }
    delete:
      operationId: deleteReview
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Deleted } }
  /contact:
    post:
      operationId: createContactMessage
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ContactInput" } }
      responses: { "201": { description: Created } }
    get:
      operationId: listContactMessages
      responses: { "200": { description: Messages } }
  /restaurant:
    get:
      operationId: getRestaurant
      responses: { "200": { description: Restaurant information } }
    put:
      operationId: updateRestaurant
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/RestaurantInput" } }
      responses: { "200": { description: Updated } }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      responses: { "200": { description: Dashboard summary } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties: { name: { type: string }, email: { type: string, format: email }, password: { type: string, minLength: 8 }, phone: { type: string } }
    LoginInput:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string } }
    CategoryInput:
      type: object
      required: [name]
      properties: { name: { type: string }, description: { type: string }, image: { type: string }, isActive: { type: boolean } }
    Category:
      allOf: [{ $ref: "#/components/schemas/CategoryInput" }, { type: object, required: [id], properties: { id: { type: integer } } }]
    MenuItemInput:
      type: object
      required: [categoryId, name, description, price]
      properties: { categoryId: { type: integer }, name: { type: string }, description: { type: string }, price: { type: number, minimum: 0 }, image: { type: string }, rating: { type: number, minimum: 0, maximum: 5 }, isVegetarian: { type: boolean }, isSpicy: { type: boolean }, isFeatured: { type: boolean }, isAvailable: { type: boolean } }
    MenuItem:
      allOf: [{ $ref: "#/components/schemas/MenuItemInput" }, { type: object, required: [id], properties: { id: { type: integer }, category: { type: string } } }]
    ReservationInput:
      type: object
      required: [customerName, email, phone, reservationDate, reservationTime, guests]
      properties: { customerName: { type: string }, email: { type: string, format: email }, phone: { type: string }, reservationDate: { type: string, format: date }, reservationTime: { type: string }, guests: { type: integer, minimum: 1, maximum: 50 }, specialRequest: { type: string } }
    ReservationUpdate:
      type: object
      properties: { status: { type: string, enum: [pending, confirmed, cancelled, completed] }, customerName: { type: string }, email: { type: string, format: email }, phone: { type: string }, reservationDate: { type: string, format: date }, reservationTime: { type: string }, guests: { type: integer }, specialRequest: { type: string } }
    OrderInput:
      type: object
      required: [customerName, customerEmail, customerPhone, orderType, items]
      properties: { customerName: { type: string }, customerEmail: { type: string, format: email }, customerPhone: { type: string }, orderType: { type: string, enum: [dine_in, takeaway, delivery] }, deliveryAddress: { type: string }, items: { type: array, items: { type: object, required: [menuItemId, quantity], properties: { menuItemId: { type: integer }, quantity: { type: integer, minimum: 1 } } } } }
    OrderUpdate:
      type: object
      properties: { status: { type: string, enum: [pending, confirmed, preparing, ready, out_for_delivery, delivered, cancelled] } }
    ReviewInput:
      type: object
      required: [customerName, rating, comment]
      properties: { menuItemId: { type: integer }, customerName: { type: string }, rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string }, isApproved: { type: boolean } }
    ContactInput:
      type: object
      required: [name, email, subject, message]
      properties: { name: { type: string }, email: { type: string, format: email }, phone: { type: string }, subject: { type: string }, message: { type: string } }
    RestaurantInput:
      type: object
      required: [restaurantName, description, address, phone, email, openingHours]
      properties: { restaurantName: { type: string }, description: { type: string }, address: { type: string }, phone: { type: string }, email: { type: string, format: email }, openingHours: { type: string }, latitude: { type: number }, longitude: { type: number }, facebookUrl: { type: string }, instagramUrl: { type: string } }